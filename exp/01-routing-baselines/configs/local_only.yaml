YX_wan_model_root: "${oc.env:WAN_MODEL_ROOT}"
model_kwargs:
  model_name: Wan2.2-TI2V-5B
  YX_wan_model_root: "${oc.env:WAN_MODEL_ROOT}"
  timestep_shift: 5.0
  num_frame_per_block: 8
  local_attn_size: 32
use_ema: false
output_folder: "${oc.env:EVAL_OUTPUT_DIR}"
num_samples: 1
save_latents_only: false
save_with_index: true
inference_iter: -1
data:
  data_path: "${oc.env:EVAL_DATA_ROOT}"
  image_or_video_shape: [1, 384, 48, 24, 40]
inference:
  sampling_steps: 4
  text_encoder_batch_size: 4
  sink_size: 8
  local_attn_size: 32
  guidance_scale: 1.0
  multi_shot_sink: false
  multi_shot_rope_offset: 0
  context_noise: 0
  streaming_vae: true
  async_vae: false
  vae_type: wan
  diffusion_device: cuda:0
  vae_device: cuda:1
layer_recall:
  layer_recall_enabled: false
checkpoints:
  generator_ckpt: "${oc.env:LONGLIVE2_CHECKPOINT}"
seed: 0
num_output_frames: 384
image_or_video_shape: [1, 384, 48, 24, 40]
scene_cut_prefix: ""
